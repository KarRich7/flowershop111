# Боевой запуск на сервере (VPS) с доменом: HTTPS-сертификат Let's Encrypt выпускается автоматически.
#   1) в .env: SITE_DOMAIN=ваш-домен.ru, ACME_EMAIL=почта, PRODUCTION=true и новые секреты (gen-secrets)
#   2) docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Снаружи открыты только порты 80/443 (Caddy). Сайт и API доступны лишь через него. Подробно — docs/DEPLOY.md
x-prod-env: &prod-env
  PRODUCTION: "true"
  DJANGO_DEBUG: "false"
  SECURE_COOKIES: "true"
  TRUSTED_PROXY_COUNT: "1"
  FRONTEND_URL: https://${SITE_DOMAIN:?Укажите SITE_DOMAIN в .env}
  BACKEND_PUBLIC_URL: https://${SITE_DOMAIN}
  DJANGO_ALLOWED_HOSTS: ${SITE_DOMAIN},www.${SITE_DOMAIN},backend,localhost,127.0.0.1
  CSRF_TRUSTED_ORIGINS: https://${SITE_DOMAIN}
  CORS_ALLOWED_ORIGINS: https://${SITE_DOMAIN}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:80"
      - "443:443"
      # 443/udp (HTTP/3) не открываем — см. deploy/Caddyfile, protocols h1 h2
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Укажите ACME_EMAIL (почта для Let's Encrypt) в .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - media:/srv/media:ro
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_started }

  backend:
    environment: *prod-env
  celery-worker:
    environment: *prod-env
  celery-beat:
    environment: *prod-env
  telegram-bot:
    environment: *prod-env
  vk-bot:
    environment: *prod-env
  frontend:
    environment:
      SITE_INDEXING: ${SITE_INDEXING:-true}

volumes:
  caddy_data:
  caddy_config:
