  /api/v1/admin/inventory/write-off:
    post:
      operationId: v1_admin_inventory_write_off_create
      summary: Списание {item_id, quantity, reason}
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
