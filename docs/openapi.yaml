openapi: 3.0.3
info:
  title: Цветочный магазин — API
  version: 0.1.0
  description: Единый API сайта, Telegram-бота, ВК-бота и админ-панели (тестовая версия).
paths:
  /api/v1/about:
    get:
      operationId: v1_about_retrieve
      summary: 'Страница «О нас»: текст и фото карусели'
      tags:
      - Магазин
      security:
      - tokenAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/account/login/start:
    post:
      operationId: v1_account_login_start_create
      summary: 'Начать вход через бота {channel: telegram|vk, order_token?}'
      tags:
      - Покупатель
      security:
      - tokenAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/account/login/status:
    post:
      operationId: v1_account_login_status_create
      summary: 'Статус входа (POST): pending | confirmed (сессия — в cookie) | expired'
      tags:
      - Покупатель
      security:
      - tokenAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/account/login/test-confirm:
    post:
      operationId: v1_account_login_test_confirm_create
      description: |-
        Только при CUSTOMER_LOGIN_TEST_MODE=true. Проходит тот же путь, что и настоящий бот: «открыть ссылку» →
        кнопка «Войти на сайт» от имени тестового пользователя мессенджера.
      summary: 'Тестовый режим: подтвердить вход без настоящего бота {token}'
      tags:
      - Покупатель
      security:
      - tokenAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/account/logout:
    post:
      operationId: v1_account_logout_create
      summary: Выйти на этом устройстве
      tags:
      - Покупатель
      security:
      - tokenAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/account/logout-all:
    post:
      operationId: v1_account_logout_all_create
      summary: Выйти на всех устройствах
      tags:
      - Покупатель
      security:
      - tokenAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/account/me:
    get:
      operationId: v1_account_me_retrieve
      summary: Профиль покупателя (GET) / изменить имя, телефон, e-mail (PATCH)
      tags:
      - Покупатель
      security:
      - tokenAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
    patch:
      operationId: v1_account_me_partial_update
      summary: Профиль покупателя (GET) / изменить имя, телефон, e-mail (PATCH)
      tags:
      - Покупатель
      security:
      - tokenAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/account/session/adopt:
    post:
      operationId: v1_account_session_adopt_create
      summary: Перенести вход из старой версии сайта (заголовок X-Customer-Token)
        в cookie
      tags:
      - Покупатель
      security:
      - tokenAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/admin/about:
    get:
      operationId: v1_admin_about_retrieve
      summary: 'Страница «О нас»: заголовок, вступление, текст {title, lead, text}'
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: v1_admin_about_partial_update
      summary: 'Страница «О нас»: заголовок, вступление, текст {title, lead, text}'
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/about/photos:
    post:
      operationId: v1_admin_about_photos_create
      summary: 'Добавить фото в карусель «О нас» (multipart: image, caption)'
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/about/photos/{photo_id}:
    patch:
      operationId: v1_admin_about_photos_partial_update
      summary: Изменить подпись {caption} или удалить фото карусели
      parameters:
      - in: path
        name: photo_id
        schema:
          type: integer
        required: true
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: v1_admin_about_photos_destroy
      summary: Изменить подпись {caption} или удалить фото карусели
      parameters:
      - in: path
        name: photo_id
        schema:
          type: integer
        required: true
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/about/photos/order:
    post:
      operationId: v1_admin_about_photos_order_create
      summary: Порядок фото карусели {ids:[...]}
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/audit-log:
    get:
      operationId: v1_admin_audit_log_retrieve
      summary: Журнал действий сотрудников
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/auth/adopt:
    post:
      operationId: v1_admin_auth_adopt_create
      summary: Перенести вход из старой версии сайта (токен в заголовке Authorization)
        в HttpOnly-cookie
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/auth/login:
    post:
      operationId: v1_admin_auth_login_create
      summary: Вход сотрудника {username, password}
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/admin/auth/logout:
    post:
      operationId: v1_admin_auth_logout_create
      summary: Выход (cookie удаляется, даже если вход уже истёк)
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/admin/auth/me:
    get:
      operationId: v1_admin_auth_me_retrieve
      summary: Текущий сотрудник
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/auth/password:
    post:
      operationId: v1_admin_auth_password_create
      summary: Сменить свой пароль {old_password, new_password} — все остальные сеансы
        завершаются
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/categories:
    get:
      operationId: v1_admin_categories_retrieve
      summary: Категории витрины ?kind=bouquet|flower; POST {kind, name}
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: v1_admin_categories_create
      summary: Категории витрины ?kind=bouquet|flower; POST {kind, name}
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/categories/{category_id}:
    patch:
      operationId: v1_admin_categories_partial_update
      summary: Переименовать {name} или удалить категорию ?move_to=<id> (товары переносятся
        или остаются без категории)
      parameters:
      - in: path
        name: category_id
        schema:
          type: integer
        required: true
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: v1_admin_categories_destroy
      summary: Переименовать {name} или удалить категорию ?move_to=<id> (товары переносятся
        или остаются без категории)
      parameters:
      - in: path
        name: category_id
        schema:
          type: integer
        required: true
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/categories/{category_id}/products:
    post:
      operationId: v1_admin_categories_products_create
      summary: Добавить товары в категорию {product_ids:[...]}
      parameters:
      - in: path
        name: category_id
        schema:
          type: integer
        required: true
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/categories/order:
    post:
      operationId: v1_admin_categories_order_create
      summary: Порядок категорий {kind, ids:[...]} — сверху вниз, как на витрине
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/couriers:
    get:
      operationId: v1_admin_couriers_retrieve
      summary: Сотрудники-курьеры
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/customers:
    get:
      operationId: v1_admin_customers_retrieve
      summary: Клиенты ?q=
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/customers/{customer_id}:
    get:
      operationId: v1_admin_customers_retrieve_2
      summary: Клиент и его заказы
      parameters:
      - in: path
        name: customer_id
        schema:
          type: integer
        required: true
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/dashboard:
    get:
      operationId: v1_admin_dashboard_retrieve
      summary: Показатели для главной панели
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/deliveries:
    get:
      operationId: v1_admin_deliveries_retrieve
      summary: Доставки на дату ?date=YYYY-MM-DD (курьер видит только свои)
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/delivery-slots:
    get:
      operationId: v1_admin_delivery_slots_retrieve
      summary: Интервалы доставки
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: v1_admin_delivery_slots_create
      summary: Интервалы доставки
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/delivery-slots/{slot_id}:
    patch:
      operationId: v1_admin_delivery_slots_partial_update
      summary: Изменить интервал {capacity, is_active} или удалить его
      parameters:
      - in: path
        name: slot_id
        schema:
          type: integer
        required: true
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: v1_admin_delivery_slots_destroy
      summary: Изменить интервал {capacity, is_active} или удалить его
      parameters:
      - in: path
        name: slot_id
        schema:
          type: integer
        required: true
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/delivery-zones:
    get:
      operationId: v1_admin_delivery_zones_retrieve
      summary: Районы доставки
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: v1_admin_delivery_zones_create
      summary: Районы доставки
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/delivery-zones/{zone_id}:
