      parameters:
      - in: path
        name: zone_id
        schema:
          type: integer
        required: true
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: v1_admin_delivery_zones_destroy
      summary: Изменить {name, price, free_from, is_active, polygons, color, sort_order}
        или удалить район
      parameters:
      - in: path
        name: zone_id
        schema:
          type: integer
        required: true
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/faq:
