      summary: 'Частые вопросы на главной: GET; PUT {blocks:[{title, items:[{q, a}]}]}
        — сохранить; DELETE — вернуть стандартные вопросы (собираются из настроек)'
      tags:
      - Админ-панель
      security:
      - tokenAuth: []
      - tokenAuth: []
      responses:
        '200':
